# 이터널 보험사별 엑셀 → 사람별 월 실적의 보험사 묶음 (agent_period_perf, agent_period_perf_insurer). 대조용 미리보기 DB 에 쓴다.
# 2026-11-17 드라이브의 실제 파일 일곱의 머리글로 만들었다. 적재기는 app/loader/trial_perf.py, 만드는 스크립트는 scripts/build_trial_db.py 다.
#
# 파일의 꼴
# - 시트가 넷이다. 보험사 인별_손보, 인별_생보, 인별_자동차, 인별_일반. 넷의 사람 칸과 사람 수가 같다.
# - 머리글이 두 줄이다. 1행은 사람 칸(NO, 본사, 본부, 지점, 센터, 팀, 사원번호, 사원명)과 묶음(총합계, 보험사 이름), 2행은 묶음의 칸(건수, 보험료(월납)).
# - 마지막 줄은 사원번호와 사원명이 빈 합계 줄이다. 사람으로 넣지 않고 사람 줄의 합과 견주기만 한다.
# - 파일 안에 기간이 없다. 월은 data/real/trial_months.yaml 로 받는다.
# - 이름만 다르고 본문이 같은 파일이 있었다. 적재기는 본문으로 같은 파일을 가려 두 번째 것을 건너뛴다.
#
# 조직 칸의 뜻은 eternal_rank_perf.yaml 과 같다. 파일 칸 이름과 실제 계층이 한 단계씩 어긋난다.
#
# 시트 넷을 한 사람의 한 달 실적으로 합친다.
# - 보험사 표(agent_period_perf_insurer)의 이름은 원문이다. 같은 보험사가 손보와 자동차, 일반 시트에 함께 나오므로
#   자동차와 일반 시트의 줄은 name_suffix 를 붙여 따로 둔다.
# - perf_group 이 있는 시트의 총합계는 실적 표의 그 묶음 칸(auto_count, auto_premium_amt 같은)에 넣는다.
# - 그 달에 인별업적순위가 없으면 네 시트 총합계의 합을 Total 로 쓴다. 있으면 인별업적순위의 누적을 쓰고 다르면 경고만 한다.
#   두 파일의 건수가 같은 뜻인지는 확인 전이다.
source: eternal
data_type: insurer_perf
versions:
  - version: 1
    effective_from: "202601"
    file:
      header_rows: 2
      name_glob: "*보험사별*.xlsx"
      # 시트마다: key 는 안에서 쓰는 이름, sector 는 업권, perf_group 은 실적 표의 묶음, name_suffix 는 보험사 표 이름에 붙이는 말.
      # est_category 는 대조용 월 합계 계약(scripts/build_trial_db.py --month-sum-contracts)에 붙이는 구분 코드다. 추정이고 확정이 아니다.
      #   손보와 생보 시트의 상품 구분은 파일에 없다. 건강보험만 세는 프로모션이 세게 하려고 health 로 둔다. 그래서 실제보다 크게 나올 수 있다.
      # month_sum 이 false 인 시트는 대표 계약을 만들지 않는다. 대조할 프로모션이 장기 상품 시책이라 자동차와 일반은 뺀다. 추정이다.
      sheets:
        "보험사 인별_손보": {key: nonlife, sector: nonlife, perf_group: null, name_suffix: "", est_category: health,
                         known_insurers: ["KB손보", "DB손보", "삼성화재", "롯데손보", "메리츠화재", "현대해상", "한화손보", "흥국화재", "농협손보",
                                          "하나손보", "MG손보", "라이나손보", "AIG손보"]}
        "보험사 인별_생보": {key: life, sector: life, perf_group: null, name_suffix: "", est_category: health,
                         known_insurers: ["한화생명", "KDB생명", "라이나생명", "동양생명", "교보생명", "하나생명", "신한라이프", "NH생명", "흥국생명",
                                          "메트라이프", "미래에셋생명", "삼성생명", "카디프생명", "푸르덴셜생명", "푸본현대생명", "ABL생명", "AIA생명",
                                          "DB생명", "iM라이프", "KB라이프", "IBK연금", "처브라이프생명", "(구)신한생명"]}
        "보험사 인별_자동차": {key: auto, sector: nonlife, perf_group: auto, name_suffix: " 자동차", est_category: auto, month_sum: false,
                          known_insurers: ["KB손보", "DB손보", "삼성화재", "롯데손보", "메리츠화재", "현대해상", "한화손보", "흥국화재", "농협손보",
                                           "하나손보", "MG손보", "라이나손보", "AIG손보"]}
        "보험사 인별_일반": {key: general, sector: nonlife, perf_group: general, name_suffix: " 일반", est_category: general, month_sum: false,
                         known_insurers: ["KB손보", "DB손보", "삼성화재", "롯데손보", "메리츠화재", "현대해상", "한화손보", "흥국화재", "농협손보",
                                          "하나손보", "MG손보", "라이나손보", "AIG손보"]}
    drop_keywords: ["주민", "생년월일", "계좌", "은행", "예금주", "소득", "이행보증", "예치금", "4대보험", "보험업계고유번호",
                    "핸드폰", "휴대폰", "전화", "이메일", "주소", "우편번호"]
    person:
      "사원번호": employee_no
      "사원명": name            # 설계사 만들기와 조직장 맞춰 보기에만 쓴다
      "본사": org_company
      "본부": org_division
      "지점": org_general       # 실제로는 총괄본부
      "센터": org_hq            # 실제로는 예하 본부
      "팀": org_branch          # 실제로는 지점
    person_required: [employee_no, name, org_company, org_division, org_general, org_hq, org_branch]
    ignore: ["NO"]
    groups:
      total:
        match: "^총합계$"
        required: true
        subs:
          "건수": count
          "보험료(월납)": monthly_premium_amt
    # 위 묶음이 아니고 칸이 꼭 이 둘인 묶음은 보험사로 본다.
    insurer_subs:
      "건수": policy_count
      "보험료(월납)": monthly_premium_amt
    # 파일의 보험사 이름과 원수사 마스터 이름이 다른 것. 마스터에서 찾을 때만 쓴다. 원문 이름은 그대로 저장한다.
    # 이 양식은 대부분 마스터 이름과 같다. MG손보, AIA생명, 푸르덴셜생명은 마스터에 없어 경고하고 이름만 남긴다 (D-71).
    insurer_alias:
      "(구)신한생명": "신한라이프"   # 신한생명은 2021년에 신한라이프로 합쳐졌다. 옛 계약 묶음으로 보고 잇는다. 가정이고 D-71 에서 확인한다
    org_levels:
      org_company: ga
      org_division: hq
      org_general: branch
      org_hq: center
      org_branch: team
