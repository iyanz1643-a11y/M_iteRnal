# 대한생명 수수료 정산서: 금액이 문자열("1,234,000", 환수는 "(1,000)"), 날짜는 2026.11.01 표기
source: DAE
data_type: statement
versions:
  - version: 1
    effective_from: "202601"
    file:
      sheet: "수수료내역"
      header_row: 2
      skip_if:
        - column: "계약번호"
          in: ["", "합계"]
    columns:
      "계약번호":     policy_no
      "FC코드":       insurer_agent_code
      "상품":         product_code
      "구분":         commission_type
      "납입회차":     installment_no
      "보험료":       basis_amount
      "수수료율":     rate
      "수수료":       amount
      "지급일자":     pay_date
    transforms:
      policy_no: [as_text, strip, {remove: ["-", " ", "."]}, upper]
      insurer_agent_code: [as_text, strip]
      product_code: [as_text, strip]
      commission_type:
        - map: {"초회": initial, "유지": renewal, "환수": clawback, "프로모션": promo}
          default: other
      installment_no: [to_int]
      basis_amount: [parse_money]
      rate: [parse_percent]
      amount: [parse_money]
      pay_date: [parse_date]
    required: [policy_no, commission_type, amount]
    totals_check: {label_column: "계약번호", label: "합계", value_column: "수수료", compare_to: amount}
