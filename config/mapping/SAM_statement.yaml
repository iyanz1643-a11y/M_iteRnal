# 샘플생명 수수료 정산서. 같은 보험사 형식이 바뀌면 effective_from 을 올린 새 version 을 추가한다.
source: SAM
data_type: statement
versions:
  - version: 1
    effective_from: "202601"
    file:
      sheet: "지급명세"
      header_row: 4
      skip_if:
        - column: "증권번호"
          in: ["", "소계", "합계"]
    columns:
      "증권번호":     policy_no
      "설계사코드":   insurer_agent_code
      "상품코드":     product_code
      "수수료구분":   commission_type
      "회차":         installment_no
      "기준보험료":   basis_amount
      "지급률":       rate
      "지급액":       amount
      "지급일":       pay_date
    transforms:
      policy_no: [as_text, strip, {remove: ["-", " ", "."]}, upper]
      insurer_agent_code: [as_text, strip]
      product_code: [as_text, strip]
      commission_type:
        - map: {"신계약": initial, "계속": renewal, "환수": clawback, "시책": promo}
          default: other
      installment_no: [to_int]
      basis_amount: [parse_money]
      rate: [parse_percent]
      amount: [parse_money]
      pay_date: [parse_date]
    required: [policy_no, commission_type, amount]
    totals_check: {label_column: "증권번호", label: "합계", value_column: "지급액", compare_to: amount}
