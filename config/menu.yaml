# 메뉴 구성의 원본. 화면의 메뉴, 권한 검사, 문서의 메뉴 표가 모두 이 파일을 따른다.
# roles 값: all(전체) / org(자기 조직과 그 아래) / self(본인). 적지 않은 역할에게는 메뉴가 보이지 않는다.
# phase: 1 운영 기반 / 2 사람별 화면 / 3 제도와 제안.  status: built(새 화면에 있음) / legacy(기존 운영 도구에 있음) / planned(기획)
roles:
  main: 메인 관리자
  manager: 관리자
  agent: 설계사

mobile_tabs: [home, promo, my, sales]      # 설계사 휴대폰 하단 탭. 나머지는 더보기로 모은다.

groups:
