<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>로그인 · GA 업무 앱</title>
<link rel="stylesheet" href="/static/app.css"></head>
<body><div class="login">
<h1>GA 업무 앱</h1><p class="sub">사번과 비밀번호로 들어옵니다.</p>
{% if error %}<div class="alert">{{ error }}</div>{% endif %}
<form class="stack" method="post" action="/login">
  <input type="text" name="login_id" placeholder="사번" autocomplete="username" required autofocus>
  <input type="password" name="password" placeholder="비밀번호" autocomplete="current-password" required>
  <button type="submit">들어가기</button>
</form></div></body></html>
