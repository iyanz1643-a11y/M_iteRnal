# 시험용 구성. 앱, 워커, DB. 운영용이 아니다. 운영 서버와 관리형 DB 는 D-14 가 정해진 뒤에 고른다.
#   cp .env.example .env        # 값을 채운다. .env 는 저장소에 올리지 않는다
#   docker compose up --build
#   docker compose --profile demo run --rm demo     # 샘플 자료와 샘플 계정을 만든다. 시험용에서만
#
# 지금 앱과 워커는 SQLite 파일 하나를 함께 쓴다(ga-data 볼륨의 app.db). db 서비스의 PostgreSQL 은
# 마이그레이션 연습용이다. 앱이 PostgreSQL 로 옮겨 가면 APP_DB 대신 그 주소를 준다.
services:
  app:
    build: .
    # command 를 두지 않는다. Dockerfile 의 CMD 로 띄워 접근 기록의 꼬리 거르개를 탄다
    env_file: .env
    environment:
      APP_DB: /app/data/app.db
    ports:
      - "8000:8000"
    volumes:
      - ga-data:/app/data
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      APP_DB: /app/data/app.db
    command: ["python", "-m", "app.worker"]
    volumes:
      - ga-data:/app/data
    depends_on:
      - app
    restart: unless-stopped
    healthcheck:
      disable: true

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ga}
      POSTGRES_USER: ${POSTGRES_USER:-ga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 넣어 주세요}
    volumes:
      - ga-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  demo:
    build: .
    profiles: ["demo"]
    env_file: .env
    command: ["python", "run_demo.py", "/app/data/app.db", "/app/data/raw/sample"]
    volumes:
      - ga-data:/app/data

volumes:
  ga-data:
  ga-pg:
